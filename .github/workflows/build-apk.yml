name: Android review build
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Restore existing install identity
        run: python3 scripts/restore_legacy_signing.py
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Verify packaged launcher artwork
        run: python3 scripts/verify_apk_brand.py
      - name: Prepare single installable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Rotam-3.0.2-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Rotam-Android-APK
          path: dist/Rotam-3.0.2-test.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rotam-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  device:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Restore existing install identity
        run: python3 scripts/restore_legacy_signing.py
      - uses: actions/download-artifact@v4
        with:
          name: rota-debug-apk
          run-id: 41357845600
          github-token: ${{ github.token }}
          path: legacy-apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install legacy-apk/app-debug.apk
            python3 scripts/seed_upgrade_fixture.py
            set +e; ./gradlew connectedDebugAndroidTest --stacktrace; test_result=$?; adb pull /sdcard/Download/rotam-test-screenshots device-screenshots; screenshot_result=$?; if [ "$test_result" -ne 0 ]; then exit "$test_result"; else exit "$screenshot_result"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rotam-emulator-report
          path: |
            device-screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: backend
