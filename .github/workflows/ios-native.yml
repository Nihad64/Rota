name: iOS native app
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify directory-synchronized project
        run: swift scripts/ios/verify_project.swift
      - uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/RotamCI/SourcePackages
          key: ios-spm-firebase13.1.1-google10.1.0-v1
      - name: Select an available iPhone simulator
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import json,subprocess,os
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          selected=next(d for version,rows in devices.items() if 'iOS' in version for d in rows if 'iPhone' in d['name'])
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('ROTAM_SIMULATOR='+selected['udid']+'\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firestore-emulator-1.22.0
      - name: Start synthetic Firebase for two independent Apple SDK clients
        run: |
          npx --yes firebase-tools@15.35.0 emulators:start --only auth,firestore --project demo-rotam --config firebase.test.json > "$RUNNER_TEMP/firebase-demo.log" 2>&1 &
          python3 tests/firestore/wait_ready.py
      - name: Build the app and widget; test offline planner with synthetic data
        run: |
          set -o pipefail
          xcodebuild -quiet -project ios/Rotam.xcodeproj -scheme Rotam -destination "platform=iOS Simulator,id=$ROTAM_SIMULATOR" -derivedDataPath "$HOME/Library/Developer/Xcode/DerivedData/RotamCI" -resultBundlePath "$RUNNER_TEMP/Rotam.xcresult" -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300 CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test | tee "$RUNNER_TEMP/ios-native.log"
      - name: Export synthetic UI screenshots and inspect simulator signature
        if: always()
        run: |
          app="$HOME/Library/Developer/Xcode/DerivedData/RotamCI/Build/Products/Debug-iphonesimulator/Rotam.app"
          if [ -d "$app" ]; then codesign -d --entitlements - "$app"; fi
          if [ -d "$RUNNER_TEMP/Rotam.xcresult" ]; then xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Rotam.xcresult" --output-path "$RUNNER_TEMP/native-screenshots"; fi
      - name: Upload small synthetic UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-screenshots
          path: ${{ runner.temp }}/native-screenshots/
          retention-days: 7
      - name: Upload synthetic simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-test-results
          path: |
            ${{ runner.temp }}/Rotam.xcresult
            ${{ runner.temp }}/ios-native.log
            ${{ runner.temp }}/firebase-demo.log
          retention-days: 7
      - name: Cache downloaded Apple package sources
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/RotamCI/SourcePackages
          key: ios-spm-firebase13.1.1-google10.1.0-v1
