plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rota.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rota.app'
        minSdk 26
        targetSdk 35
        versionCode 22
        versionName '2.1.0'
    }

    signingConfigs {
        stable {
            storeFile file("../rotam-stable.jks")
            storePassword "RotamStable2026!"
            keyAlias "rotam"
            keyPassword "RotamStable2026!"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
